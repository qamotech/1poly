name: Build check (Vite + TypeScript)

# This project is built with Vite, not Webpack (the old template workflow ran
# `npx webpack`, which never built this app). This workflow typechecks and
# builds on every push/PR so a broken build is caught before Render deploys.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
